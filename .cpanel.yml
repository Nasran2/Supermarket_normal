---
# This checkout is already inside the hosting document root.
# Preserve hosting PHP selection, credentials, uploads and database.
deployment:
  tasks:
    - /bin/chmod 755 public
    - /bin/chmod 644 .htaccess public/.htaccess storage/app/public/.htaccess
    - /opt/cpanel/ea-php83/root/usr/bin/php artisan config:clear
    - /opt/cpanel/ea-php83/root/usr/bin/php artisan route:clear
    - /opt/cpanel/ea-php83/root/usr/bin/php artisan view:clear
